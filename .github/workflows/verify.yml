name: verify

# A kernel-checked rebuild of all project modules from source.
#
# It does not fit in one GitHub-hosted job: the closure is 15,050 modules and
# about a hundred and forty CPU-hours, three quarters of it in the 1,226
# residual certificate chains.  So the build is a matrix.  Every job rebuilds
# its own SRG266 dependencies from source; Mathlib is consumed from the cache
# for its pinned revision.  Each job uploads the oleans it produced.  The final
# job merges them, assembles the headline theorem and checks which axioms it
# rests on.  It then packages the complete project olean closure for fast
# kernel replay.  A manual release run can attach that bundle to an existing
# GitHub Release after every verification step has succeeded.

on:
  # A full verification is twenty-nine jobs and about a hundred and forty
  # CPU-hours, so it is deliberately launched only by a maintainer.
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch, tag, or commit to verify
        required: true
        default: main
        type: string
      release_tag:
        description: Existing Release tag to receive the olean bundle (optional; must equal source_ref)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  # `decide +kernel` on these certificates peaks near 6 GB in a single
  # process, and a GitHub runner has 16 GB, so two at a time is the budget.
  # `LEAN_NUM_THREADS=1` is what makes one `lake build` mean one `lean`.
  # `shards.py build` runs at most `PARALLEL` Lake processes, and only when
  # their still-unbuilt import closures are disjoint.  Shared dependencies are
  # therefore built once rather than raced by independent Lake processes.
  LEAN_NUM_THREADS: '1'
  PARALLEL: '2'

jobs:
  plan:
    name: Plan the matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - id: source
        name: Freeze the source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate the optional Release target
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be a semantic-version tag such as v1.1.0" >&2
            exit 1
          fi
          if [[ "$SOURCE_REF" != "$RELEASE_TAG" ]]; then
            echo "source_ref and release_tag must be identical for a release build" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Audit the source snapshot
        run: python3 scripts/shards.py audit
      - id: plan
        run: echo "matrix=$(python3 scripts/shards.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.stratum }} ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib oleans
        run: lake exe cache get

      - name: Build this shard
        run: >-
          python3 scripts/shards.py build
          "${{ matrix.stratum }}" "${{ matrix.shard }}" "${{ matrix.of }}"

      - name: Pack the oleans
        run: |
          # The generated C is several GB and nothing downstream reads it.
          rm -rf .lake/build/ir
          tar -C .lake/build/lib/lean -c SRG266 | zstd -9 -T0 -o oleans.tar.zst
          ls -lh oleans.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: oleans-${{ matrix.stratum }}-${{ matrix.shard }}
          path: oleans.tar.zst
          retention-days: 1
          compression-level: 0

  verify:
    name: Assemble and check the axioms
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Make room for the merged build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib oleans
        run: lake exe cache get

      - uses: actions/download-artifact@v8
        with:
          pattern: oleans-*
          path: shards

      # From here on the proof is elaborated by `lean` directly rather than by
      # `lake build`.  Lake treats a module as stale unless the C file it
      # emits alongside the olean is present, and the shards deliberately did
      # not ship several gigabytes of generated C; asking Lake to build would
      # rebuild the entire proof in this one job.
      - name: Merge the shard oleans
        run: |
          mkdir -p .lake/build/lib/lean
          # Lean's output is reproducible, so where two shards rebuilt the
          # same dependency they wrote the same bytes and overwriting is
          # harmless.  Each archive is deleted as it is unpacked, to keep the
          # peak disk use at one copy.
          for archive in shards/*/oleans.tar.zst; do
            zstd -dc "$archive" | tar -C .lake/build/lib/lean -x
            rm "$archive"
          done
          echo "$(find .lake/build/lib/lean/SRG266 -name '*.olean' | wc -l) oleans merged"

      - name: Point lean at Mathlib and at the merged build
        run: |
          deps="$(ls -d .lake/packages/*/.lake/build/lib/lean | tr '\n' ':')"
          echo "LEAN_PATH=${deps}.lake/build/lib/lean" >> "$GITHUB_ENV"

      - name: Assemble the final theorem
        run: |
          # The dispatchers, the assembly, and the coverage modules where the
          # two halves of the argument meet: they import across strata, so no
          # shard could produce them, and they are cheap now that everything
          # they need is in place.  `shards.py` lists them in dependency
          # order, and they are elaborated one at a time: the group-4 Hall
          # dispatcher replays 366 masks in a single kernel declaration and
          # peaks near 10 GB.
          python3 scripts/shards.py targets final | while read -r module; do
            olean=".lake/build/lib/lean/${module//.//}.olean"
            mkdir -p "$(dirname "$olean")"
            echo "  $module"
            lean "${module//.//}.lean" -o "$olean"
          done

      - name: The theorem rests on exactly the three standard axioms
        run: |
          lean scripts/print_axioms.lean | tee axioms.txt
          python3 - <<'PY'
          import re
          import sys

          report = open("axioms.txt").read()
          line = re.search(
              r"'SRG266\.srg266_nonexistence' depends on axioms: \[([^\]]*)\]", report)
          if line is None:
              sys.exit(f"no axiom report for the headline theorem:\n{report}")
          found = {axiom.strip() for axiom in line.group(1).split(",")}
          if found != {"propext", "Classical.choice", "Quot.sound"}:
              sys.exit(f"unexpected axioms {sorted(found)} in:\n{report}")
          print("srg266_nonexistence rests on propext, Classical.choice, Quot.sound")
          PY

      - name: No compiled evaluation anywhere in the closure
        run: python3 scripts/shards.py audit

      - name: Package the verified olean closure
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          module_count="$(find .lake/build/lib/lean/SRG266 -type f -name '*.olean' | wc -l)"
          if [[ "$module_count" -ne 15050 ]]; then
            echo "expected 15050 project oleans, found $module_count" >&2
            exit 1
          fi

          # Only oleans are needed by `leanchecker`; do not publish editor or
          # native-code byproducts under the name of a replay bundle.
          find .lake/build/lib/lean/SRG266 -type f ! -name '*.olean' -delete

          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          lean_version="${toolchain##*:v}"
          label="${RELEASE_TAG:-${SOURCE_SHA:0:12}}"
          archive="srg266-${label}-lean${lean_version}-oleans.tar.zst"
          mkdir -p dist
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C .lake/build/lib/lean -c SRG266 \
            | zstd -9 -T0 -o "dist/$archive"

          archive_size="$(stat --format=%s "dist/$archive")"
          if (( archive_size >= 2147483648 )); then
            echo "the Release asset is $archive_size bytes; split it below GitHub's 2 GiB limit" >&2
            exit 1
          fi

          archive_sha="$(sha256sum "dist/$archive" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' lakefile.toml)"
          jq -n \
            --arg archive "$archive" \
            --arg archive_sha256 "$archive_sha" \
            --arg lean_toolchain "$toolchain" \
            --arg lake_manifest_sha256 "$manifest_sha" \
            --arg package_version "$package_version" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_SHA" \
            --arg workflow_run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson module_count "$module_count" \
            '{
              archive: $archive,
              archive_sha256: $archive_sha256,
              kind: "prebuilt Lean olean environment for kernel replay",
              lake_manifest_sha256: $lake_manifest_sha256,
              lean_toolchain: $lean_toolchain,
              module_count: $module_count,
              package_version: $package_version,
              release_tag: (if $release_tag == "" then null else $release_tag end),
              source_commit: $source_commit,
              workflow_run: $workflow_run
            }' > dist/srg266-olean-manifest.json
          printf '%s  %s\n' "$archive_sha" "$archive" > "dist/$archive.sha256"
          ls -lh dist

      - name: Preserve the replay bundle as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: srg266-prebuilt-oleans-${{ needs.plan.outputs.source_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    name: Attach the replay bundle to the Release
    if: ${{ inputs.release_tag != '' }}
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Confirm that the Release tag is the verified commit
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "Release tag resolved to $actual, but the verified commit was $SOURCE_SHA" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: srg266-prebuilt-oleans-${{ needs.plan.outputs.source_sha }}
          path: dist
      - name: Upload the public Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
